name: Release Skill Package

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build standard skill zip
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag: ${TAG}"
          mkdir -p dist/skill
          # skill package = SKILL.md + templates/, no top-level folder
          cp -r SKILL.md templates dist/skill
          cd dist/skill
          zip -r "../repo-standardizer-${TAG}.zip" . >/dev/null
          cd ..
          ls -la
          unzip -l "repo-standardizer-${TAG}.zip" | head -25

      - name: Extract changelog entry for release body
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "$TAG" <<'PYEOF' > /tmp/release-body.md
          import re, sys
          tag = sys.argv[1]
          try:
              text = open('CHANGELOG.md', encoding='utf-8').read()
          except FileNotFoundError:
              print(''); sys.exit(0)
          m = re.search(r'^## \[' + re.escape(tag) + r'\][^\n]*\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          print(m.group(1).strip() if m else '')
          PYEOF
          echo "body bytes: $(wc -c < /tmp/release-body.md)"

      - name: Create GitHub Release with asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/repo-standardizer-*.zip
          body_path: /tmp/release-body.md
